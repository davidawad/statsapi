[package]
name = "statsapi-bea"
version = "0.1.0"
edition.workspace = true
license = "GPL-3.0-or-later"
publish = false
description = "Reusable blocking Rust client for the U.S. Bureau of Economic Analysis Regional API"

[dependencies]
fastrand = "2"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"

[lints]
workspace = true

[package]
name = "statsapi-bis"
version = "0.1.0"
edition.workspace = true
license = "GPL-3.0-or-later"
publish = false
description = "Reusable client for the keyless BIS Data Portal SDMX API: credit gaps, total credit, property prices, debt service ratios"
readme = "README.md"

[dependencies]
csv = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
thiserror = "2"

[lints]
workspace = true

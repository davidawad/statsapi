[package]
name = "statsapi-envirofacts"
version = "0.1.0"
edition.workspace = true
license = "GPL-3.0-or-later"
publish = false
description = "Reusable blocking Rust client for EPA Envirofacts (TRI) and the EPA Superfund NPL ArcGIS layer"

[lints]
workspace = true

[dependencies]
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde_json = "1"
sha2 = "0.10"

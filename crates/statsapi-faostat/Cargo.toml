[package]
name = "statsapi-faostat"
version = "0.1.0"
edition.workspace = true
license = "GPL-3.0-or-later"
publish = false
description = "Reusable blocking client that streams FAOSTAT bulk datasets and filters one country in memory"

[lints]
workspace = true

[dependencies]
csv = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
zip = { version = "9.0.3", default-features = false, features = ["deflate"] }

[package]
name = "statsapi-fbi-cde"
version = "0.1.0"
edition.workspace = true
license = "GPL-3.0-or-later"
publish = false
description = "Blocking Rust client for the FBI Crime Data Explorer summarized-offense API"
readme = "README.md"

[dependencies]
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lints]
workspace = true

[package]
name = "statsapi-fcc-bdc"
version = "0.1.0"
edition.workspace = true
license = "GPL-3.0-or-later"
publish = false
description = "Reusable blocking client for FCC Broadband Data Collection public files"
readme = "README.md"

[lints]
workspace = true

[dependencies]
csv = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
zip = { version = "9.0.3", default-features = false, features = ["deflate"] }


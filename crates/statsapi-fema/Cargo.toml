[package]
name = "statsapi-fema"
version = "0.1.0"
edition.workspace = true
license = "GPL-3.0-or-later"
publish = false
description = "Reusable blocking client for OpenFEMA and FEMA public data services"

[features]
default = []
cache = ["dep:ephemeral-cache"]

[lints]
workspace = true

[dependencies]
ephemeral-cache = { path = "../ephemeral-cache", optional = true }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
serde_json = "1"

[package]
name = "statsapi-fhfa"
version = "0.1.0"
edition.workspace = true
license = "GPL-3.0-or-later"
publish = false
description = "Reusable streaming client for FHFA annual house price index files by ZIP, county and tract"

[lints]
workspace = true

[dependencies]
calamine = "0.36"
csv = "1"
fastrand = "2"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
thiserror = "2"

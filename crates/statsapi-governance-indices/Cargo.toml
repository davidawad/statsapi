[package]
name = "statsapi-governance-indices"
version = "0.1.0"
edition.workspace = true
license = "GPL-3.0-or-later"
publish = false
description = "Reusable blocking client for the Transparency International CPI and RSF World Press Freedom Index"

[lints]
workspace = true

[dependencies]
csv = "1"
quick-xml = "0.38.4"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
zip = { version = "9.0.3", default-features = false, features = ["deflate"] }

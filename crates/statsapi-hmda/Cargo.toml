[package]
name = "statsapi-hmda"
version = "0.1.0"
edition.workspace = true
license = "GPL-3.0-or-later"
publish = false
description = "Reusable Rust client for the FFIEC HMDA Data Browser CSV API."
readme = "README.md"

[lints]
workspace = true

[dependencies]
csv = "1"
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
sha2 = "0.10"
thiserror = "2"

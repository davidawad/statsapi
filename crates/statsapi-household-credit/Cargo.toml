[package]
name = "statsapi-household-credit"
version = "0.1.0"
edition.workspace = true
license = "GPL-3.0-or-later"
publish = false
description = "Reusable client for public household credit data from the NY Fed, Federal Reserve Board, and Urban Institute"

[dependencies]
calamine = "0.36"
csv = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
sha2 = "0.10"
thiserror = "2"
zip = { version = "9.0.3", default-features = false, features = ["deflate"] }

[lints]
workspace = true

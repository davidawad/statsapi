[package]
name = "statsapi-irs-eo"
version = "0.1.0"
edition.workspace = true
license = "GPL-3.0-or-later"
publish = false
description = "Reusable parsers and blocking access helpers for IRS exempt-organization files"
readme = "README.md"

[lints]
workspace = true

[dependencies]
csv = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
thiserror = "2"
zip = { version = "9.0.3", default-features = false, features = ["deflate"] }


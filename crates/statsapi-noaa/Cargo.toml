[package]
name = "statsapi-noaa"
version = "0.1.0"
edition.workspace = true
license = "GPL-3.0-or-later"
publish = false
description = "Reusable client for NOAA NCEI Storm Events bulk files"

[features]
default = []
cache = ["dep:ephemeral-cache"]

[lints]
workspace = true

[dependencies]
ephemeral-cache = { path = "../ephemeral-cache", optional = true }
csv = "1"
flate2 = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }

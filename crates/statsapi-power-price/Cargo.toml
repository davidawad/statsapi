[package]
name = "statsapi-power-price"
version = "0.1.0"
edition.workspace = true
license = "GPL-3.0-or-later"
publish = false
description = "Reusable client for public U.S. electricity price data"

[features]
default = []
cache = ["dep:ephemeral-cache"]

[dependencies]
ephemeral-cache = { path = "../ephemeral-cache", optional = true }
csv = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
calamine = "0.37"
zip = { version = "9", default-features = false, features = ["deflate"] }

[lints]
workspace = true

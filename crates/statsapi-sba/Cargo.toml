[package]
name = "statsapi-sba"
version = "0.1.0"
edition.workspace = true
license = "GPL-3.0-or-later"
publish = false
description = "Reusable streaming Rust client for the SBA open data 7(a), 504 and PPP loan files."
readme = "README.md"

[lints]
workspace = true

[dependencies]
csv = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
thiserror = "2"

[package]
name = "statsapi-sdmx"
version = "0.1.0"
edition.workspace = true
license = "GPL-3.0-or-later"
publish = false
description = "Reusable blocking SDMX HTTP client and response decoder"
readme = "README.md"

[dependencies]
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
rand = "0.8"
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
thiserror = "2"

[lints]
workspace = true

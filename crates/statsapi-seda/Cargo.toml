[package]
name = "statsapi-seda"
version = "0.1.0"
edition.workspace = true
license = "GPL-3.0-or-later"
publish = false
description = "Blocking CSV client for Stanford Education Data Archive releases"

[lints]
workspace = true

[dependencies]
ephemeral-cache = { path = "../ephemeral-cache" }
csv = "1"
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
thiserror = "2"

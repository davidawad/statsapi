[package]
name = "statsapi-statcan"
version = "0.1.0"
edition.workspace = true
license = "GPL-3.0-or-later"
publish = false
description = "Reusable blocking client for the Statistics Canada Web Data Service (WDS)"

[lib]
name = "statsapi_statcan"
path = "src/lib.rs"

[lints]
workspace = true

[dependencies]
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls", "json"] }
serde_json = { version = "1", features = ["preserve_order"] }

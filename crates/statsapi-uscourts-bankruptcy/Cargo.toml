[package]
name = "statsapi-uscourts-bankruptcy"
version = "0.1.0"
edition.workspace = true
license = "GPL-3.0-or-later"
publish = false
description = "Blocking Rust client for U.S. Courts F-5A bankruptcy statistics"
readme = "README.md"

[lints]
workspace = true

[dependencies]
calamine = "0.36"
fastrand = "2"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
sha2 = "0.10"
thiserror = "2"

[package]
name = "statsapi-usda-food-access"
version = "0.1.0"
edition.workspace = true
license = "GPL-3.0-or-later"
publish = false
description = "Reusable client for USDA ERS food access and FNS SNAP data files"

[lints]
workspace = true

[dependencies]
calamine = "0.36"
csv = "1"
ephemeral-cache = { path = "../ephemeral-cache" }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
zip = { version = "9.0.3", default-features = false, features = ["deflate"] }

[dev-dependencies]
tempfile = "3"

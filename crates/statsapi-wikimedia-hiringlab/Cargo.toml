[package]
name = "statsapi-wikimedia-hiringlab"
version = "0.1.0"
edition.workspace = true
license = "GPL-3.0-or-later"
publish = false
description = "Reusable blocking client for Wikimedia pageviews and Indeed Hiring Lab job postings"

[dependencies]
csv = "1"
fastrand = "2"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"

[lints]
workspace = true

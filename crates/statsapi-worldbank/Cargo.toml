[package]
name = "statsapi-worldbank"
version = "0.1.0"
edition.workspace = true
license = "GPL-3.0-or-later"
publish = false
description = "Reusable blocking client for the World Bank Indicators API v2"

[lib]
name = "statsapi_worldbank"
path = "src/lib.rs"

[lints]
workspace = true

[dependencies]
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"

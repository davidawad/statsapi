[package]
name = "statsapi-wvs-pew"
version = "0.1.0"
edition.workspace = true
license = "GPL-3.0-or-later"
publish = false
description = "Parsers and weighting for manually downloaded World Values Survey and Pew data files"

[lib]
name = "statsapi_wvs_pew"

[dependencies]
ambers = "0.6"
arrow = "57"
calamine = "0.36"
csv = "1.4"
isocountry = "0.3"
serde_json = { version = "1", features = ["preserve_order"] }

[lints]
workspace = true
